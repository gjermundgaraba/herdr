[package]
name = "herdr-frontend"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false
description = "Client for the per-TUI frontend socket of the gjermundgaraba/herdr fork (protocol 7)"
repository = "https://github.com/gjermundgaraba/herdr"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
